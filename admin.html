<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekvion | Panel de Administración</title>
    <!-- Fuente profesional para evitar fatiga visual -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-oscuro: #0b2545;
            --naranja: #ff6b00;
            --azul-claro: #4a7c9d;
            --blanco: #ffffff;
            --gris-fondo: #f0f4f8; /* Gris azulado muy suave */
            --gris-texto: #64748b;
            --sombra-suave: 0 4px 20px rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--gris-fondo);
            color: var(--azul-oscuro);
            -webkit-font-smoothing: antialiased;
        }

        /* --- PANTALLA DE LOGIN --- */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0eaf5 0%, #f0f4f8 100%);
        }

        .login-card {
            background: var(--blanco);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .login-card img {
            height: 70px;
            margin-bottom: 1.5rem;
        }

        .login-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--azul-oscuro);
        }

        .login-card p {
            color: var(--gris-texto);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--azul-oscuro);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--naranja);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--naranja);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background-color: #e65c00;
        }

        /* --- DASHBOARD --- */
        .dashboard-wrapper {
            display: none; /* Oculto hasta iniciar sesión */
            height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--azul-oscuro);
            color: white;
            padding: 2rem 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            padding: 0 2rem;
            margin-bottom: 3rem;
        }

        .sidebar-logo img {
            height: 45px;
            filter: brightness(0) invert(1); /* Hace el logo blanco si es oscuro */
        }

        .nav-item {
            padding: 1rem 2rem;
            color: #a0aec0;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border-left: 4px solid var(--naranja);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .top-bar h1 {
            font-size: 1.8rem;
            color: var(--azul-oscuro);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            box-shadow: var(--sombra-suave);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: transparent;
            border: none;
            color: #e53e3e;
            cursor: pointer;
            font-weight: 600;
            margin-left: 10px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--blanco);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--sombra-suave);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-info h3 {
            font-size: 0.85rem;
            color: var(--gris-texto);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .stat-info p {
            font-size: 2rem;
            font-weight: 700;
            color: var(--azul-oscuro);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
        
        .icon-blue { background: #e0f2fe; color: #0284c7; }
        .icon-green { background: #dcfce7; color: #16a34a; }
        .icon-orange { background: #ffedd5; color: #ea580c; }

        /* Table */
        .table-container {
            background: var(--blanco);
            border-radius: 12px;
            box-shadow: var(--sombra-suave);
            overflow: hidden;
        }

        .table-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-header h2 {
            font-size: 1.2rem;
            color: var(--azul-oscuro);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1.2rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            color: var(--gris-texto);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        td {
            font-size: 0.95rem;
            vertical-align: middle;
        }

        td strong { color: var(--azul-oscuro); }
        td small { color: var(--gris-texto); }

        /* Badges de Estado */
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        
        .badge-pendiente { background: #fef3c7; color: #b45309; }
        .badge-proceso { background: #dbeafe; color: #1d4ed8; }
        .badge-completado { background: #dcfce7; color: #15803d; }

        /* Botones de Acción */
        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-proceso { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .btn-proceso:hover { background: #dbeafe; }

        .btn-completado { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .btn-completado:hover { background: #dcfce7; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard-wrapper { flex-direction: column; }
            .sidebar { width: 100%; padding: 1rem; flex-direction: row; justify-content: space-between; align-items: center;}
            .sidebar-logo { margin-bottom: 0; padding: 0; }
            .sidebar nav { display: none; } /* Ocultar menú en móvil por simplicidad */
            .main-content { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div class="login-wrapper" id="loginScreen">
        <div class="login-card">
            <!-- Asegúrate de que logo.png esté en la misma carpeta -->
            <img src="logo.png" alt="Tekvion Logo">
            <h2>Acceso Administrativo</h2>
            <p>Ingresa tus credenciales para gestionar Tekvion.</p>
            
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej. exito">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button class="btn-login" onclick="verificarLogin()">Iniciar Sesión</button>
        </div>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN (Oculto por defecto) -->
    <div class="dashboard-wrapper" id="dashboardScreen">
        
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <!-- Usamos el logo en blanco gracias al filtro CSS -->
                <img src="logo.png" alt="Tekvion Logo">
            </div>
            <nav>
                <a href="#" class="nav-item active">📊 Dashboard</a>
                <a href="#" class="nav-item">📦 Pedidos</a>
                <a href="#" class="nav-item">👥 Clientes</a>
                <a href="#" class="nav-item">⚙️ Ajustes</a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <!-- Barra Superior -->
            <div class="top-bar">
                <h1>Resumen General</h1>
                <div class="user-info">
                    <span>👤 Diego (Admin)</span>
                    <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
                </div>
            </div>

            <!-- Tarjetas de Estadísticas -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Ingresos Totales</h3>
                        <p id="totalRevenue">$0 USD</p>
                    </div>
                    <div class="stat-icon icon-green">💵</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Pedidos Recibidos</h3>
                        <p id="totalOrders">0</p>
                    </div>
                    <div class="stat-icon icon-blue">🛒</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>En Proceso</h3>
                        <p id="ordersInProcess">0</p>
                    </div>
                    <div class="stat-icon icon-orange">⏳</div>
                </div>
            </div>

            <!-- Tabla de Pedidos -->
            <div class="table-container">
                <div class="table-header">
                    <h2>Últimos Pedidos</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Plan</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <!-- Los datos se inyectan con JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- LÓGICA DE JAVASCRIPT (Simulación) -->
    <script>
        // --- 1. LÓGICA DE LOGIN ---
        function verificarLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Credenciales exactas solicitadas
            if (user === 'exito' && pass === '109080') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                cargarDatosDeEjemplo(); // Cargamos los datos al entrar
            } else {
                alert('❌ Usuario o contraseña incorrectos. Inténtalo de nuevo.');
            }
        }

        function cerrarSesion() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
        }

        // --- 2. DATOS DE EJEMPLO (Para probar el diseño) ---
        // Cuando conectes Firebase, borras esta función y usas la base de datos real.
        let pedidosSimulados = [
            { id: 1, cliente: "Carlos Ruiz", email: "carlos@empresa.cl", plan: "Plan Full", monto: 99, estado: "Pendiente" },
            { id: 2, cliente: "María Jose", email: "majo@tienda.cl", plan: "Plan Intermedio", monto: 79, estado: "En Proceso" },
            { id: 3, cliente: "Panadería El Sol", email: "contacto@elsol.cl", plan: "Plan Básico", monto: 49, estado: "Completado" }
        ];

        function cargarDatosDeEjemplo() {
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('ordersBody');
            tbody.innerHTML = '';
            let totalDinero = 0;
            let enProceso = 0;

            pedidosSimulados.forEach(pedido => {
                totalDinero += pedido.monto;
                if(pedido.estado === 'En Proceso') enProceso++;

                // Clases CSS para los colores de las píldoras
                let badgeClass = 'badge-pendiente';
                if (pedido.estado === 'En Proceso') badgeClass = 'badge-proceso';
                if (pedido.estado === 'Completado') badgeClass = 'badge-completado';

                // Creamos la fila
                const row = `
                    <tr>
                        <td>
                            <strong>${pedido.cliente}</strong><br>
                            <small>${pedido.email}</small>
                        </td>
                        <td>${pedido.plan}</td>
                        <td><strong>$${pedido.monto}</strong></td>
                        <td><span class="badge ${badgeClass}">${pedido.estado}</span></td>
                        <td>
                            <div class="action-buttons">
                                ${pedido.estado !== 'En Proceso' && pedido.estado !== 'Completado' 
                                    ? `<button class="btn-action btn-proceso" onclick="cambiarEstado(${pedido.id}, 'En Proceso')">Procesar</button>` 
                                    : ''}
                                ${pedido.estado !== 'Completado' 
                                    ? `<button class="btn-action btn-completado" onclick="cambiarEstado(${pedido.id}, 'Completado')">Completar</button>` 
                                    : ''}
                                ${pedido.estado === 'Completado' ? '✅ Listo' : ''}
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Actualizar números de arriba
            document.getElementById('totalRevenue').innerText = `$${totalDinero} USD`;
            document.getElementById('totalOrders').innerText = pedidosSimulados.length;
            document.getElementById('ordersInProcess').innerText = enProceso;
        }

        // --- 3. CAMBIAR ESTADO (Simulación) ---
        function cambiarEstado(id, nuevoEstado) {
            // Buscamos el pedido y le cambiamos el estado
            const pedido = pedidosSimulados.find(p => p.id === id);
            if (pedido) {
                pedido.estado = nuevoEstado;
                renderizarTabla(); // Volvemos a pintar la tabla para ver el cambio
            }
        }
    </script>
</body>
</html>
